<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animasi Stickman Penggunaan Modul Gudang — SyntesiaERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      gap: 14px;
    }
    .header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .header p { font-size: 12px; color: #94a3b8; }
    .stage-wrap {
      width: 100%;
      max-width: 1200px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #070b14;
      cursor: pointer;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-emerald { background: #059669; color: #fff; }
    .btn-ghost { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-amber { background: #d97706; color: #fff; }
    .scrubber-wrap {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .time { font-family: monospace; font-size: 12px; color: #94a3b8; min-width: 95px; text-align: right; }
    .chapters {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .chap-btn {
      text-align: left;
      background: #111827;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 10px;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }
    .chap-btn.active {
      border-color: #38bdf8;
      background: #0f172a;
      color: #fff;
    }
    .chap-num { font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase; }
    .chap-title { font-size: 12px; font-weight: 700; }
    #recStatus { font-size: 12px; color: #34d399; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Animasi Stickman: Simulasi Penggunaan Modul Gudang</h1>
      <p>Visualisasi karakter pengguna mengoperasikan aplikasi Web &amp; Mobile lengkap dengan suara presenter (id-ID-ArdiNeural)</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="recStatus"></span>
      <button id="btnDownload" class="btn-emerald" onclick="exportWebmVideo()">Download Video (.webm)</button>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="controls">
      <button id="btnPlay" class="btn-primary" onclick="togglePlay()">Pause</button>
      <button class="btn-ghost" onclick="restartVideo()">Ulang</button>
      <button id="btnVoice" class="btn-amber" onclick="toggleVoice()">Suara Narasi: ON</button>
      <div class="scrubber-wrap">
        <input id="scrubber" type="range" min="0" max="1000" value="0" oninput="onScrub(this.value)" />
        <span id="timeLabel" class="time">00:00 / 02:05</span>
      </div>
    </div>
  </div>

  <div id="chapterGrid" class="chapters"></div>

    function base64ToArrayBuffer(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;

    async function ensureAudioDecoded() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();

      if (!decodePromise) {
        decodePromise = (async () => {
          const entries = Object.entries(window.AUDIO_CLIPS || {});
          await Promise.all(entries.map(async ([id, b64]) => {
            if (!b64) return;
            try {
              const ab = base64ToArrayBuffer(b64);
              decodedBuffers[id] = await audioCtx.decodeAudioData(ab);
            } catch (e) {
              console.warn('Audio decode failed for', id, e);
            }
          }));
        })();
      }
      await decodePromise;
      return audioCtx;
    }

    function stopActiveAudio() {
      if (activeSource) {
        try { activeSource.stop(); } catch {}
        try { activeSource.disconnect(); } catch {}
        activeSource = null;
      }
    }

    async function unlockAudioAndSync() {
      await ensureAudioDecoded();
      if (audioCtx && audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch {}
      }
      if (isPlaying && voiceEnabled && !isExporting) {
        const cur = getSceneAt(currentTime);
        lastSpokenScene = -1;
        maybeSpeak(cur.index, cur.local);
      }
    }

    function getSceneAt(t) {
      let acc = 0;
      for (let i = 0; i < SCENES.length; i++) {
        const s = SCENES[i];
        if (t < acc + s.duration || i === SCENES.length - 1) {
          const local = Math.max(0, Math.min(s.duration, t - acc));
          return { index: i, scene: s, local, progress: local / s.duration };
        }
        acc += s.duration;
      }
      return { index: 0, scene: SCENES[0], local: 0, progress: 0 };

    function jumpToScene(idx) {

      maybeSpeak(idx, 0);

    function maybeSpeak(idx, localOffset = 0) {

      stopActiveAudio();
      const sc = SCENES[idx];

      if (audioCtx && audioCtx.state === 'running' && buf) {

          src.start(0, Math.max(0, localOffset));

    function roundRect(x, y, w, h, r, fill, stroke, lineWidth = 1.5) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, color = '#cbd5e1', font = '16px Segoe UI') {
      ctx.font = font;
      ctx.fillStyle = color;
      const words = String(text).split(' ');
      let line = '';
      let cy = y;
      for (let i = 0; i < words.length; i++) {
        const test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, cy);
          line = words[i];
          cy += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, cy);
      return cy;
    }

    function drawBox(x, y, w, h, label, bg = '#d97706', border = '#fbbf24', textColor = '#fff') {

      ctx.fillRect(x + w * 0.35, y + 2, w * 0.3, 8);
      if (label) {

        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.fillText(label, x + w / 2, y + h / 2 + 5);
        ctx.textAlign = 'left';

    }

        ctx.moveTo(0, hipY);
        ctx.lineTo(kx, ky);
        ctx.lineTo(fx, fy);
        ctx.lineTo(fx + 10 * facing, fy);

      ctx.stroke();

        roundRect(-11, shoulderY + 3, 22, 34, 6, vestColor, '#0f172a', 1.5);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(-10, shoulderY + 24, 20, 4);
      } else if (tieColor) {
        ctx.fillStyle = tieColor;
        ctx.beginPath();
        ctx.moveTo(0, shoulderY + 4);
        ctx.lineTo(5, shoulderY + 24);
        ctx.lineTo(0, shoulderY + 30);
        ctx.lineTo(-5, shoulderY + 24);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = color;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.arc(0, headY, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(5 * facing, headY - 3, 2.2, 0, Math.PI * 2);
      ctx.arc(11 * facing, headY - 3, 2.0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === 'surprised') {
        ctx.arc(7 * facing, headY + 6, 3.5, 0, Math.PI * 2);
      } else if (mood === 'focused') {
        ctx.moveTo(3 * facing, headY + 6);
        ctx.lineTo(11 * facing, headY + 6);
      } else {
        ctx.arc(6 * facing, headY + 3, 6, 0.15 * Math.PI, 0.85 * Math.PI);
      }
      ctx.stroke();

      if (helmetColor) {
        ctx.fillStyle = helmetColor;
        ctx.beginPath();
        ctx.arc(0, headY - 5, 18, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-19, headY - 7, 38, 5);
      } else if (tieColor) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(1 * facing - (facing < 0 ? 11 : 0), headY - 7, 11, 7);
      }

      const drawArm = (ang, prop, isBack = false) => {
        ctx.save();
        if (isBack) ctx.globalAlpha = 0.78;
        ctx.strokeStyle = color;
        ctx.lineWidth = 4.5;
        const ex = Math.sin(ang) * 24 * facing;
        const ey = shoulderY + 4 + Math.cos(ang) * 24;
        const hx = ex + Math.sin(ang + 0.55) * 22 * facing;
        const hy = ey + Math.cos(ang + 0.55) * 22;
        ctx.beginPath();
        ctx.moveTo(0, shoulderY + 4);
        ctx.lineTo(ex, ey);
        ctx.lineTo(hx, hy);
        ctx.stroke();

        if (prop === 'phone') {
          drawPhoneProp(hx + 6 * facing, hy - 4, '#34d399');
        } else if (prop === 'scanner') {
          drawScannerProp(hx + 4 * facing, hy, facing, beamColor);
        } else if (prop === 'box') {
          drawBox(hx - 14, hy - 28, 36, 30, boxLabel, '#d97706', '#fbbf24');
        } else if (prop === 'clipboard') {
          roundRect(hx - 8, hy - 14, 18, 24, 3, '#e2e8f0', '#475569', 1.5);
          ctx.fillStyle = '#3b82f6';
          ctx.fillRect(hx - 4, hy - 16, 10, 4);
        }
        ctx.restore();
      };

      drawArm(armLeftAngle, propLeft, true);
      drawArm(armRightAngle, propRight, false);

      if (label) {
        roundRect(-62, 82, 124, 24, 12, 'rgba(15,23,42,0.9)', vestColor || tieColor || '#38bdf8', 1.5);
        ctx.font = 'bold 11px Segoe UI';
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(label, 0, 98);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function drawSpeechBubble(x, y, text, bg = '#ffffff', fg = '#0f172a', border = '#38bdf8') {
      ctx.font = 'bold 13px Segoe UI';
      const w = Math.max(110, ctx.measureText(text).width + 26);
      roundRect(x - w / 2, y - 36, w, 34, 12, bg, border, 2);
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(x - 6, y - 2);
      ctx.lineTo(x + 6, y - 2);
      ctx.lineTo(x, y + 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = fg;
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y - 14);
      ctx.textAlign = 'left';
    }

    function drawCursor(cx, cy, clicking = false) {
      ctx.save();
      ctx.translate(cx, cy);
      if (clicking) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 22);
      ctx.lineTo(6, 17);
      ctx.lineTo(12, 26);
      ctx.lineTo(16, 23);
      ctx.lineTo(10, 14);
      ctx.lineTo(18, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawShelf(x, y, w, h, levels = 2) {
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 5;
      ctx.strokeRect(x, y, w, h);
      for (let i = 1; i <= levels; i++) {
        const ly = y + (h / (levels + 1)) * i;
        ctx.fillStyle = '#334155';
        ctx.fillRect(x, ly, w, 6);
      }
    }

    function drawAppWindow(x, y, w, h, title, accent = '#38bdf8') {
      roundRect(x, y, w, h, 14, 'rgba(15, 23, 42, 0.96)', accent, 2);
      roundRect(x, y, w, 36, 14, '#1e293b', null);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(x, y + 20, w, 16);
      ['#ef4444', '#f59e0b', '#10b981'].forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x + 18 + i * 16, y + 18, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.font = 'bold 13px Segoe UI';
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(title, x + 72, y + 23);
    }

    function drawMobileFrame(x, y, w, h, title, accent = '#14b8a6') {
      roundRect(x, y, w, h, 24, '#020617', '#64748b', 3);
      roundRect(x + 10, y + 14, w - 20, h - 28, 16, '#0f172a', accent, 1.5);
      roundRect(x + w / 2 - 26, y + 18, 52, 6, 3, '#334155', null);
      ctx.font = 'bold 12px Segoe UI';
      ctx.fillStyle = accent;
      ctx.fillText(title, x + 22, y + 46);

    function drawTruck(x, y) {
      ctx.save();
      ctx.translate(x, y);
      roundRect(0, 0, 145, 92, 8, '#1e3a8a', '#60a5fa', 2);
      roundRect(148, 26, 62, 66, 8, '#2563eb', '#93c5fd', 2);

      ctx.font = 'bold 13px Segoe UI';
      ctx.fillText('DELIVERY', 36, 44);
      ctx.font = '11px monospace';
      ctx.fillStyle = '#93c5fd';
      ctx.fillText('DO-2026', 44, 62);

        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(wx, 94, 15, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#cbd5e1';

    function loop(ts) {
      if (lastTs !== null && isPlaying) {
        const dt = Math.min(0.1, (ts - lastTs) / 1000);
        currentTime += dt;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = 0;
          lastSpokenScene = -1;
        }
      }
      lastTs = ts;
      renderFrame(currentTime);
      requestAnimationFrame(loop);
    }

    async function exportWebmVideo(fastHeadless = false) {
      const btn = document.getElementById('btnDownload');
      const statusEl = document.getElementById('recStatus');
      btn.disabled = true;
      isPlaying = false;
      isExporting = true;
      stopActiveAudio();
      statusEl.textContent = 'Menyiapkan audio presenter...';

      await ensureAudioDecoded();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const audioDest = audioCtx.createMediaStreamDestination();
      const keepAliveOsc = audioCtx.createOscillator();
      const silentGain = audioCtx.createGain();
      silentGain.gain.value = 0;
      keepAliveOsc.connect(silentGain);
      silentGain.connect(audioDest);
      keepAliveOsc.start();

      const t0 = audioCtx.currentTime + 0.15;
      const scheduledSources = [];
      let accOffset = 0;
      for (const sc of SCENES) {
        const buf = decodedBuffers[sc.id];
        if (buf) {
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioDest);
          src.start(t0 + accOffset);
          scheduledSources.push(src);
        }
        accOffset += sc.duration;
      }

      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks(),
      ]);

      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
          ? 'video/webm;codecs=vp8,opus'
          : 'video/webm';

      const recorder = new MediaRecorder(combinedStream, {
        mimeType: mime,
        videoBitsPerSecond: 3200000,
        audioBitsPerSecond: 96000,
      });
      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      const donePromise = new Promise((resolve) => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: mime }));
      });

      recorder.start(250);
      let frameCount = 0;
      while (true) {
        const elapsed = audioCtx.currentTime - t0;
        const simTime = Math.max(0, Math.min(TOTAL_DURATION, elapsed));
        currentTime = simTime;
        renderFrame(simTime);
        if (frameCount % 15 === 0) {
          statusEl.textContent = `Merender video + audio... ${Math.round((simTime / TOTAL_DURATION) * 100)}%`;
        }
        frameCount++;
        if (elapsed >= TOTAL_DURATION + 0.12) break;
        await new Promise((r) => setTimeout(r, 32));
      }

      recorder.stop();
      const blob = await donePromise;

      scheduledSources.forEach((s) => { try { s.stop(); s.disconnect(); } catch {} });
      try { keepAliveOsc.stop(); keepAliveOsc.disconnect(); silentGain.disconnect(); } catch {}
      isExporting = false;
      statusEl.textContent = `Selesai! (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
      btn.disabled = false;

      if (!fastHeadless) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'animasi-stickman-gudang.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }
      return blob;
    }

    window.renderWebmBase64 = async () => {
      const blob = await exportWebmVideo(false);
      const buf = await blob.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let bin = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(bin);
    };

    requestAnimationFrame(loop);
